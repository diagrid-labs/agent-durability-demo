apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.name" . }}-credentials
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
  POSTGRES_DB: {{ .Values.auth.appDatabase | quote }}
  DAPR_DB: {{ .Values.auth.daprDatabase | quote }}
