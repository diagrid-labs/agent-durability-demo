image:
  repository: postgres
  tag: "16-alpine"
  pullPolicy: IfNotPresent

auth:
  username: bankadmin
  password: bankadmin
  appDatabase: bankdemo
  daprDatabase: dapr_state

service:
  port: 5432

persistence:
  enabled: true
  size: 1Gi
  # AKS default-managed CSI driver. Override to "default" for older clusters,
  # or "" to fall back to whatever the cluster's default class is.
  storageClassName: managed-csi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Pin to the control nodepool so chaos targeting the agents pool never
# accidentally clips the source of truth.
nodeSelector:
  bank-heist.role: platform

tolerations: []

# Demo defaults: $100 start, $200 target, 10 customers.
seed:
  startBalance: 100
  targetBalance: 200
