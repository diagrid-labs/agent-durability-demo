image:
  repository: alicejgibbons/bank-creditor-mcp
  tag: "0.1.0"
  # Always-pull so a fresh push on the same tag is picked up without a bump.
  pullPolicy: Always

replicaCount: 1

service:
  # 80 so URLs omit the port; targetPort always routes to container port 8000.
  port: 80
  # LoadBalancer for one-step external access (see CATALYST_SELF_HOSTED.md);
  # prefer ClusterIP + shared ingress for multi-service production deploys.
  type: LoadBalancer
  # AKS-only: with type=LoadBalancer, annotates a DNS name for the public IP.
  # Must be unique per region; leave empty to use the raw IP.
  azureDnsLabel: "demo-prod-catalyst-agents"

# Connection to the Postgres chart's Service.
postgres:
  host: postgres.bank-creditor.svc.cluster.local
  port: 5432
  database: bankdemo
  credentialsSecret: postgres-credentials
  poolMax: 20

# In-cluster agent Service URL, used by /agent/* proxy routes so the
# same-origin UI can drive the agent worker without CORS.
agent:
  httpBase: http://agent.bank-creditor.svc.cluster.local:8000

logLevel: INFO

# Pill next to the UI title so deployments are distinguishable on stage.
deploymentLabel: "Diagrid Catalyst"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Control nodepool — never a chaos target.
nodeSelector:
  bank-creditor.role: platform

tolerations: []

# For /chaos/pod-kill: lets the MCP server list+delete pods matching
# podChaos.labelSelector in its own namespace. Disable for read-only deploys.
rbac:
  enabled: true

podChaos:
  labelSelector: "app.kubernetes.io/name=agent"
