{{- if .Values.rbac.enabled }}
# Namespaced: list+delete pods for /chaos/pod-kill.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mcp.name" . }}-pod-killer
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mcp.name" . }}-pod-killer
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mcp.name" . }}-pod-killer
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp.name" . }}
    namespace: {{ .Release.Namespace }}
---
# Cluster-scoped: nodes aren't namespaced, so /chaos/infra needs a
# ClusterRole. Read-only, bound only to this namespace's MCP account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcp.name" . }}-node-reader-{{ .Release.Namespace }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mcp.name" . }}-node-reader-{{ .Release.Namespace }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mcp.name" . }}-node-reader-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp.name" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.catalystSidecar.enabled }}
---
# Cross-namespace: lets this MCP account restart Catalyst's sidecar for this
# app-id in its prj-<id> namespace — one pod, not the shared control plane.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mcp.name" . }}-sidecar-restarter
  namespace: {{ .Values.catalystSidecar.namespace }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mcp.name" . }}-sidecar-restarter
  namespace: {{ .Values.catalystSidecar.namespace }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mcp.name" . }}-sidecar-restarter
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
