apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp.name" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
  {{- if and (eq (.Values.service.type | default "ClusterIP") "LoadBalancer") .Values.service.azureDnsLabel }}
  annotations:
    # AKS-only: provisions <label>.<region>.cloudapp.azure.com on the
    # public IP backing this Service's LoadBalancer. Label must be unique
    # within the Azure region.
    service.beta.kubernetes.io/azure-dns-label-name: {{ .Values.service.azureDnsLabel | quote }}
  {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "mcp.selectorLabels" . | nindent 4 }}
