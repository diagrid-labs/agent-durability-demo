kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bank-heist

# Topology mirrors the demo story:
#   control  → Postgres, Dapr placement, MCP server, orchestrator (never attacked)
#   a, b, c  → agent worker pods (chaos targets)
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # UI / orchestrator. NodePort 30080 → host 8080.
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP

  - role: worker
    labels:
      topology.kubernetes.io/zone: control
      bank-heist.role: platform

  - role: worker
    labels:
      topology.kubernetes.io/zone: a
      bank-heist.role: agents

  - role: worker
    labels:
      topology.kubernetes.io/zone: b
      bank-heist.role: agents

  - role: worker
    labels:
      topology.kubernetes.io/zone: c
      bank-heist.role: agents
