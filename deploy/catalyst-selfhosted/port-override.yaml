# Expose the gateway on standard 80/443 so the diagrid CLI's default :443 works.
# Apply with: diagrid region deploy <region> --values-file <this-file>
gateway:
  envoy:
    service:
      port: 80
      httpsPort: 443
agent:
    config:
      otel:
        loki_endpoint: https://catalyst-logs.r1.diagrid.io/otlp/v1/logs