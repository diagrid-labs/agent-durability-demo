image:
  repository: alicejgibbons/bank-creditor-agent
  tag: "0.1.0"
  # Always-pull so a fresh push on the same tag is picked up without a bump.
  pullPolicy: Always

# One pod per AZ (topology spread in deployment.yaml splits across
# topology.kubernetes.io/zone) — match to the agents nodepool's AZ count.
replicaCount: 2

service:
  port: 8000

mcp:
  # Catalyst MCPServer resource fronting the Postgres MCP server (registered
  # via `diagrid mcpserver create`). Requires an access grant for this app-id.
  serverName: bank-postgres-mcp

# In Catalyst mode the state store is provisioned via `diagrid kv create`
# instead, so create:false here avoids an in-cluster CRD conflict.
# LangGraph durability comes from Dapr Workflow activity persistence, not this.
stateStore:
  create: false
  componentName: agent-memory
  postgresHost: postgres.bank-creditor.svc.cluster.local
  postgresPort: 5432
  postgresDatabase: dapr_state
  # Inline demo credentials. Unused when create=false.
  postgresUser: bankadmin
  postgresPassword: bankadmin

logLevel: INFO

# stub | real. Real mode requires apiKeySecret to be set.
agent:
  llm:
    mode: stub
    model: gpt-4o-mini
    # Secret with key OPENAI_API_KEY. Only required when mode=real.
    apiKeySecret: ""

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 1500m
    memory: 768Mi

# Agent workers run in the agents nodepool — chaos targets.
nodeSelector:
  bank-creditor.role: agents

tolerations: []

# Real Azure-AZ spread for the AZ-outage story, via AKS's per-node zone label.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule

dapr:
  # False under Catalyst — pods get no daprd sidecar; the SDK talks to
  # Catalyst directly instead.
  enabled: true
  appId: bank-agent-creditor
  appPort: 8000
  appProtocol: http
  logLevel: info

# Catalyst connection. apiTokenSecret must exist in the namespace before install.
catalyst:
  enabled: false
  httpEndpoint: ""
  grpcEndpoint: ""
  apiTokenSecret: catalyst-agent-worker
  apiTokenSecretKey: DAPR_API_TOKEN
  # Bypasses AKS hairpin NAT for same-cluster Catalyst Self-Hosted.
  hostAliases: []
