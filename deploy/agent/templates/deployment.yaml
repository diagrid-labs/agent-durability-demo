apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.name" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent.labels" . | nindent 8 }}
      {{- if .Values.dapr.enabled }}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: {{ .Values.dapr.appId | quote }}
        dapr.io/app-port: {{ .Values.dapr.appPort | quote }}
        dapr.io/app-protocol: {{ .Values.dapr.appProtocol | quote }}
        dapr.io/log-level: {{ .Values.dapr.logLevel | quote }}
      {{- end }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Bypass AKS hairpin NAT when Catalyst gateway is in the same cluster. */}}
      {{- with (.Values.catalyst).hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if (.Values.topologySpread).enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "agent.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: MCP_URL
              value: {{ .Values.mcp.url | quote }}
            - name: MCP_HTTP_BASE
              value: {{ .Values.mcp.httpBase | quote }}
            - name: USE_DAPR_INVOKE
              value: {{ .Values.mcp.useDaprInvoke | default false | quote }}
            - name: DAPR_MCP_APP_ID
              value: {{ .Values.mcp.daprAppId | default "bank-mcp-server" | quote }}
            - name: STUB_LLM
              value: {{ eq .Values.agent.llm.mode "stub" | ternary "true" "false" | quote }}
            - name: AGENT_MODEL
              value: {{ .Values.agent.llm.model | quote }}
            - name: MAX_CONCURRENT_ACTIVITIES
              value: {{ .Values.concurrency.maxActivities | quote }}
            - name: MAX_CONCURRENT_ORCHESTRATIONS
              value: {{ .Values.concurrency.maxOrchestrations | quote }}
            - name: MAX_THREAD_POOL_WORKERS
              value: {{ .Values.concurrency.threadPoolWorkers | quote }}
            - name: AGENT_STATE_STORE
              value: {{ .Values.stateStore.componentName | quote }}
            {{- if and (eq .Values.agent.llm.mode "real") .Values.agent.llm.apiKeySecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.llm.apiKeySecret }}
                  key: OPENAI_API_KEY
            {{- end }}
            {{- /* `(.Values.catalyst).enabled` is nil-safe — won't blow up
                  when `helm upgrade --reuse-values` carries forward an
                  older release whose stored values predate the catalyst
                  block. Equivalent to `.Values.catalyst.enabled` otherwise. */}}
            {{- if (.Values.catalyst).enabled }}
            # Catalyst Cloud mode: no sidecar, the Dapr SDK reads these to
            # talk to the Catalyst project endpoints directly.
            - name: DAPR_HTTP_ENDPOINT
              value: {{ .Values.catalyst.httpEndpoint | quote }}
            - name: DAPR_GRPC_ENDPOINT
              value: {{ .Values.catalyst.grpcEndpoint | quote }}
            - name: DAPR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalyst.apiTokenSecret }}
                  key: {{ .Values.catalyst.apiTokenSecretKey }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
