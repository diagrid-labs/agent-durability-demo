{{- if .Values.stateStore.create }}
# In-cluster Dapr Component for the workflow state store. Skip this template
# in Catalyst Cloud / Self-Hosted mode (`--set stateStore.create=false`) —
# the component lives in the Catalyst project there, provisioned via
# `diagrid kv create`, and applying the CRD here would either conflict or
# be silently ignored by the Catalyst-mode daprd.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.stateStore.componentName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  type: state.postgresql
  version: v1
  metadata:
    - name: connectionString
      value: "host={{ .Values.stateStore.postgresHost }} port={{ .Values.stateStore.postgresPort }} user={{ .Values.stateStore.postgresUser }} password={{ .Values.stateStore.postgresPassword }} dbname={{ .Values.stateStore.postgresDatabase }} sslmode=disable"
    - name: actorStateStore
      value: "true"
{{- end }}
