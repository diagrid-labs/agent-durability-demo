services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bankadmin
      POSTGRES_PASSWORD: bankadmin
      POSTGRES_DB: bankdemo
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - bankdemo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankadmin -d bankdemo"]
      interval: 2s
      timeout: 2s
      retries: 20

  mcp:
    build:
      context: ..
      dockerfile: services/mcp/Dockerfile
    environment:
      DATABASE_URL: postgresql://bankadmin:bankadmin@postgres:5432/bankdemo
      DB_POOL_MAX: "100"
      LOG_LEVEL: INFO
      UI_PROTOTYPE_DIR: /ui-prototype
      # Agent worker runs on the host via `diagrid dev run` (see CATALYST.md);
      # the UI proxies `/agent/*` requests through this service to reach it.
      AGENT_HTTP_BASE: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../ui-prototype:/ui-prototype:ro
    ports:
      - "9000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  bankdemo-data:
