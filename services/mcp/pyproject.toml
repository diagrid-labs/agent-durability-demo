[project]
name = "bank-creditor-mcp-server"
version = "0.1.0"
description = "MCP server fronting Postgres for the Bank Creditor demo"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "asyncpg>=0.29.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.6.0",
  "httpx>=0.27",
  # In-cluster pod-kill chaos. Skipped silently when not running in a Pod
  # (in-cluster config missing) — keeps local docker-compose unaffected.
  "kubernetes>=29.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
