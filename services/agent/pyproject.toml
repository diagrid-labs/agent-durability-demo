[project]
name = "bank-creditor-agent"
version = "0.1.0"
description = "Dapr workflow worker for the Bank Creditor demo"
requires-python = ">=3.11"
dependencies = [
  "dapr-agents>=1.0.5",
  "dapr>=1.18.3",
  "dapr-ext-workflow>=1.18.3",
  "mcp>=1.2.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_worker"]
