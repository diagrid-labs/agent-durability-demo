[project]
name = "bank-creditor-agent-plain"
version = "0.1.0"
description = "Plain LangGraph worker for the Bank Creditor demo — no Dapr, no Catalyst"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "mcp>=1.2.0,<2.0.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_worker"]
