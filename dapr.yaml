version: 1
common:
  appLogDestination: console
  daprdLogDestination: console
  enableAppHealthCheck: false
  logLevel: info
apps:
  - appID: bank-agent-creditor
    appDirPath: ./services/agent-langgraph
    daprHTTPPort: 3500
    appPort: 8000
    appProtocol: http
    command: ["uv", "run", "uvicorn", "agent_worker.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env:
      STUB_LLM: "true"
      LOG_LEVEL: INFO
      # LangSmith tracing: uncomment, and export LANGSMITH_API_KEY in your shell.
      # LANGSMITH_TRACING: "true"
      # LANGSMITH_PROJECT: bank-creditor
